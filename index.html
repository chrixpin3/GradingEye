<!DOCTYPE html>
<html class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Exam Answer Generator</title>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    textarea, input, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 14px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #1e40af;
    }

    pre {
      background: #f1f1f1;
      padding: 10px;
      white-space: pre-wrap;
      border-radius: 4px;
      min-height: 150px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>📄 AI Question Paper Solver</h2>
    <textarea
      id="prompt"
      placeholder="e.g. hello how are you?"
    ></textarea>
    <button onclick="answer()">Generate Answers</button>
    <h3>AI Answers</h3>
    <pre id="output">Waiting for input...</pre>
  </div>
 <script>
  async function answer() {
    const promptt = document.getElementById("prompt").value;
    console.log(promptt);
    const server = await fetch("http://localhost:3000/answer");
     const res = await fetch("http://localhost:3000/answer", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ promptt })
    });
    let answerText = await server.text(); // renamed to avoid confusion with function name
    console.log(answerText); 
    // optionally display in the <pre> element
    document.getElementById("output").innerText = answerText;
  }
</script>

</body>
</html>
